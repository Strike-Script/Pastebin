<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Generator Web Ucapan Romantis</title>
    <style>
        body { font-family: 'Poppins', sans-serif; background: #121212; color: #fff; margin: 0; padding: 20px; }
        .container { max-width: 600px; margin: auto; background: #1e1e1e; padding: 20px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.5); }
        h2 { text-align: center; color: #ff889c; }
        label { display: block; margin-top: 15px; font-size: 14px; color: #ffccd5; }
        input, textarea { width: 100%; padding: 10px; margin-top: 5px; background: #2a2a2a; border: 1px solid #444; color: #fff; border-radius: 6px; box-sizing: border-box; }
        textarea { resize: vertical; height: 80px; }
        .btn-group { display: flex; gap: 10px; margin-top: 20px; }
        button { flex: 1; padding: 12px; border: none; border-radius: 6px; font-weight: bold; cursor: pointer; transition: 0.2s; }
        .btn-preview { background: #ff3366; color: white; }
        .btn-preview:hover { background: #e02e5b; }
        .btn-reset { background: #444; color: white; }
        .btn-reset:hover { background: #555; }
        iframe { width: 100%; height: 500px; border: 2px solid #444; border-radius: 8px; margin-top: 20px; background: #000; }
    </style>
</head>
<body>

<div class="container">
    <h2>💖 Generator Web Ucapan 💖</h2>
    <p style="text-align: center; font-size: 13px; color: #aaa;">Atur teks dan foto di bawah, lalu klik Preview atau Reset jika ada yang keliru!</p>

    <label>Teks Pertama (Header / Pembuka):</label>
    <input type="text" id="inputTeks1" value="Selamat hari Minggu buat kamu yang manisnya nambah muluu 😆💗">

    <label>Teks Kedua (Pertanyaan / Btw):</label>
    <input type="text" id="inputTeks2" value="Btw, Kamu tau gaa? 🤣">

    <label>Teks Ketiga (Pantun / Isi Utama):</label>
    <textarea id="inputTeks3">Di jalanan ada lampu, Di kuburan ada hantu, Di kerajaan ada ratu, Tapi di hatiku ... 🤔 Cuma ada kamuu 🫶 Hehehe i lvv uuu 🫣🩷</textarea>

    <label>Link Musik MP3:</label>
    <input type="text" id="inputAudio" value="https://feeldreams.github.io/audio/angelbabydj.mp3">

    <label>Link Foto / Stiker Pertama:</label>
    <input type="text" id="inputStiker1" value="https://htmlku.com/0/panda/hiya.gif">

    <div class="btn-group">
        <button class="btn-reset" onclick="resetForm()">🔄 Reset / Hapus</button>
        <button class="btn-preview" onclick="generatePreview()">👁️ Preview Hasil</button>
    </div>

    <h3 style="margin-top: 25px; font-size: 16px;">Live Preview:</h3>
    <iframe id="previewFrame"></iframe>
</div>

<script>
function generatePreview() {
    const t1 = document.getElementById('inputTeks1').value;
    const t2 = document.getElementById('inputTeks2').value;
    const t3 = document.getElementById('inputTeks3').value;
    const audio = document.getElementById('inputAudio').value;
    const stiker1 = document.getElementById('inputStiker1').value;

    // Template HTML yang akan dirender secara dinamis ke dalam iframe preview
    const templateHTML = `
    <!DOCTYPE html>
    <html>
    <head>
        <meta charset='UTF-8'/>
        <meta name='viewport' content='width=device-width, initial-scale=1'/>
        <script src="https://unpkg.com/typeit@8.7.0/dist/index.umd.js"><\/script>
        <style>
            body { background: #000; color: #fff; font-family: 'Poppins', sans-serif; text-align: center; padding: 20px; }
            .stiker img { width: 90px; height: 90px; border-radius: 50%; border: 2px solid #fff; padding: 5px; background: rgba(255,255,255,0.8); }
            p { font-size: 18px; line-height: 1.6; margin-top: 20px; }
            .btn-play { background: #ff3366; color: #fff; padding: 10px 20px; border: none; border-radius: 20px; font-weight: bold; cursor: pointer; margin-top: 20px; }
        </style>
    </head>
    <body>
        <div class="stiker">
            <img src="${stiker1}" />
        </div>
        <h2>${t1}</h2>
        <p><b>${t2}</b></p>
        <p>${t3}</p>
        <button class="btn-play" onclick="document.getElementById('bgm').play()">▶ Putar Musik & Mulai</button>
        <audio id="bgm" src="${audio}" loop></audio>
    </body>
    </html>
    `;

    const iframe = document.getElementById('previewFrame');
    const iframeDoc = iframe.contentDocument || iframe.contentWindow.document;
    iframeDoc.open();
    iframeDoc.write(templateHTML);
    iframeDoc.close();
}

function resetForm() {
    document.getElementById('inputTeks1').value = '';
    document.getElementById('inputTeks2').value = '';
    document.getElementById('inputTeks3').value = '';
    document.getElementById('inputAudio').value = '';
    document.getElementById('inputStiker1').value = '';
    document.getElementById('previewFrame').srcdoc = '';
}

// Jalankan preview otomatis saat pertama buka
generatePreview();
</script>

</body>
</html>
